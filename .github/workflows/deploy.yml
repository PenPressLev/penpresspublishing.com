# Publishes the site to GitHub Pages on every change, once a day, and on demand.
name: Publish site
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * *"   # daily, about 6:30 AM Eastern (7:30 during daylight time)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh Latest from the Vanguard
        run: node scripts/fetch-latest.mjs
      - name: Assemble the public folder
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
